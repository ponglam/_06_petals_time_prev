<!doctype html><meta charset="utf-8"><title>PETALS validation</title><style>body{background:#f3f1eb;font:14px monospace}canvas{width:180px;margin:8px}pre{white-space:pre-wrap}</style><h1>PETALS / renderer validation</h1><pre id="result">Running…</pre><div id="gallery"></div><script src="../src/core/model.js"></script><script src="../src/render/shaders.js"></script><script src="../src/render/renderer.js"></script><script>
try{const c=document.createElement('canvas'),r=new Petals.Renderer(c,{width:300,height:400}),ages=[1,3651,7301,10951,14601],data=new Map();let lines=[];function eq(a,b){return a.length===b.length&&a.every((v,i)=>v===b[i]);}for(const ageDays of ages){r.render({seed:'PETALS-001',ageDays});data.set(ageDays,r.pixels());const img=new Image();img.src=c.toDataURL();img.width=180;img.title='Day '+ageDays;document.getElementById('gallery').append(img);}for(const ageDays of[14601,1,10951,3651,7301,1]){r.render({seed:'PETALS-001',ageDays});if(!eq(data.get(ageDays),r.pixels()))throw Error('Scrub mismatch '+ageDays);}lines.push('PASS: all five timeline positions reproduce pixel-for-pixel after out-of-order scrubbing.');for(let i=1;i<ages.length;i++)if(eq(data.get(ages[i]),data.get(ages[i-1])))throw Error('Age did not change pixels');lines.push('PASS: every milestone has a distinct image.');r.render({seed:'IRIS-024',ageDays:7301});if(eq(data.get(7301),r.pixels()))throw Error('Seed did not change pixels');lines.push('PASS: different seeds produce distinct pixels.');
for(const day of [10,365,3650]){r.render({seed:'PETALS-001',ageDays:day});const a=r.pixels();r.render({seed:'PETALS-001',ageDays:day+1});const b=r.pixels();let delta=0;for(let i=0;i<a.length;i+=4)delta+=Math.abs(a[i]-b[i])+Math.abs(a[i+1]-b[i+1])+Math.abs(a[i+2]-b[i+2]);const mean=delta/(a.length/4*3);if(mean<.1)throw Error('Insufficient daily pixel change '+day);lines.push('PASS: Day '+day+' → '+(day+1)+' mean RGB change '+mean.toFixed(3));r.render({seed:'PETALS-001',ageDays:day});if(!eq(a,r.pixels()))throw Error('Daily replay mismatch');}
if(r.gl.getError()!==r.gl.NO_ERROR)throw Error('WebGL error');lines.push('PASS: shader compilation, framebuffer completeness, WebGL error checks.');document.getElementById('result').textContent=lines.join('\n');document.title='PASS — PETALS validation';r.dispose();}catch(e){document.getElementById('result').textContent=e.stack;document.title='FAIL — PETALS validation';}
</script>
